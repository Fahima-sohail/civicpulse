apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# CI replaces the tags with the commit SHA before applying this overlay.
images:
  - name: civicpulse-backend
    newName: ghcr.io/fahima-sohail/civicpulse-backend
    newTag: latest
  - name: civicpulse-frontend
    newName: ghcr.io/fahima-sohail/civicpulse-frontend
    newTag: latest
