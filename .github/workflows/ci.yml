name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, type check, and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test tools
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]" ruff mypy
      - name: Lint backend
        working-directory: backend
        run: ruff check app tests
      - name: Type check backend
        working-directory: backend
        run: mypy app
      - name: Test backend with coverage
        working-directory: backend
        run: pytest --cov=app --cov-fail-under=65

  frontend:
    name: Frontend lint, type check, build, and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Type check frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Test frontend
        working-directory: frontend
        run: npm test

  image_security:
    name: Build and scan container images
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --tag civicpulse-backend:ci ./backend
      - name: Build frontend image
        run: docker build --tag civicpulse-frontend:ci ./frontend
      - name: Scan backend image for fixable high or critical vulnerabilities
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: civicpulse-backend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Scan frontend image for fixable high or critical vulnerabilities
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: civicpulse-frontend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  manifests:
    name: Render and validate Kubernetes manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Render Kustomize overlays
        run: |
          kubectl kustomize k8s/overlays/dev > "$RUNNER_TEMP/civicpulse-dev.yaml"
          kubectl kustomize k8s/overlays/prod > "$RUNNER_TEMP/civicpulse-prod.yaml"
      - name: Validate rendered manifests with kubeconform
        run: |
          docker run --rm --volume "$RUNNER_TEMP:/work" ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary -ignore-missing-schemas /work/civicpulse-dev.yaml
          docker run --rm --volume "$RUNNER_TEMP:/work" ghcr.io/yannh/kubeconform:v0.7.0 \
            -strict -summary -ignore-missing-schemas /work/civicpulse-prod.yaml

  integration:
    name: Compose end-to-end smoke test
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Start the Compose stack and wait for health checks
        run: docker compose up --build --detach --wait --wait-timeout 900
      - name: Exercise the frontend proxy, API, persistence, and cache
        run: |
          set -euo pipefail
          curl --fail --retry 20 --retry-connrefused http://localhost:8000/ready
          complaint='{"text":"Water pipe burst near the school; the road is flooding badly.","location":"Street 12, Gulshan"}'
          created=$(curl --fail --silent --show-error --request POST http://localhost:5173/api/complaints \
            --header 'Content-Type: application/json' --data "$complaint")
          complaint_id=$(printf '%s' "$created" | jq --raw-output '.id')
          test "$complaint_id" != "null"
          curl --fail --silent --show-error "http://localhost:5173/api/complaints/$complaint_id" | jq --exit-status '.id == $id' --arg id "$complaint_id"
          first_headers=$(curl --silent --show-error --dump-header - --output /dev/null http://localhost:5173/api/stats | tr -d '\r')
          second_headers=$(curl --silent --show-error --dump-header - --output /dev/null http://localhost:5173/api/stats | tr -d '\r')
          printf '%s' "$first_headers" | grep --fixed-strings 'X-Cache: MISS'
          printf '%s' "$second_headers" | grep --fixed-strings 'X-Cache: HIT'
      - name: Show service state after a failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color
      - name: Stop and remove test data
        if: always()
        run: docker compose down --volumes --remove-orphans
