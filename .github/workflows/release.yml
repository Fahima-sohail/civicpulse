name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Verify release candidate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          pytest --cov=app --cov-fail-under=65
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm test

  publish:
    name: Publish version-tagged images and release notes
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Publish backend release image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          provenance: false
          tags: ghcr.io/fahima-sohail/civicpulse-backend:${{ github.ref_name }}
      - name: Publish frontend release image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          provenance: false
          tags: ghcr.io/fahima-sohail/civicpulse-frontend:${{ github.ref_name }}
      - name: Create GitHub release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --generate-notes --title "CivicPulse ${{ github.ref_name }}"
